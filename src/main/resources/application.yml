server:
  port: 8080
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/running_api
    username: runninging
    password: runninging
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 60000
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 500
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

app:
  storage:
    location: ./storage
  user:
    max-hr: 185 # Pulsaciones máximas por defecto para zonas FC
  elevation:
    min-threshold-meters: 0.1 # Umbral de histéresis para filtrar ruido GPS en elevación
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,https://running-api.pdrgmz.uk,http://running-api.pdrgmz.uk
  openapi:
    server-url: https://running-api.pdrgmz.uk

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method


#logging:
 # level.org.hibernate.orm.jdbc.bind: TRACE


logging:
  level:
    com.running.api.service.FileService: DEBUG
    com.running.api.service.BulkUploadStatusTracker: DEBUG
