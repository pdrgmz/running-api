server:
  port: 8080
  forward-headers-strategy: framework

spring:
  autoconfigure:
    # Esta API usa JWT; desactiva el usuario "user" por defecto y su password generado.
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5433/running_api
    username: runninging
    password: runninging
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 60000
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 500
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

app:
  storage:
    location: ./storage
  user:
    max-hr: 185 # Pulsaciones máximas por defecto para zonas FC
  elevation:
    min-threshold-meters: 0.1 # Umbral de histéresis para filtrar ruido GPS en elevación
    # Completa altitudes nulas/0 consultando un modelo digital de elevaciones (Open-Meteo).
    external-enabled: ${APP_ELEVATION_EXTERNAL_ENABLED:true}
    api-url: ${APP_ELEVATION_API_URL:https://api.open-meteo.com/v1/elevation}
    # Opcional. Si se define, se usa customer-api.open-meteo.com y se envía como apikey.
    api-key: ${APP_ELEVATION_API_KEY:}
    # Open-Meteo cuenta una llamada por coordenada (límite gratuito: 600/min).
    batch-size: ${APP_ELEVATION_BATCH_SIZE:50}
    timeout-seconds: ${APP_ELEVATION_TIMEOUT_SECONDS:10}
    min-interval-millis: ${APP_ELEVATION_MIN_INTERVAL_MILLIS:100}
    # Presupuesto propio por debajo de las 600 llamadas/min de Open-Meteo.
    max-calls-per-minute: ${APP_ELEVATION_MAX_CALLS_PER_MINUTE:500}
    max-retries: ${APP_ELEVATION_MAX_RETRIES:2}
    retry-backoff-millis: ${APP_ELEVATION_RETRY_BACKOFF_MILLIS:2000}
    max-retry-after-seconds: ${APP_ELEVATION_MAX_RETRY_AFTER_SECONDS:60}
    # Backfill diferido de altitudes.
    # 80 coordenadas cada 15 min = 7.680/día y ~230.400/mes, con margen sobre
    # los límites de 10.000/día y 300.000/mes.
    backfill:
      enabled: ${APP_ELEVATION_BACKFILL_ENABLED:true}
      cron: ${APP_ELEVATION_BACKFILL_CRON:0 */15 * * * *}
      max-calls-per-run: ${APP_ELEVATION_BACKFILL_MAX_CALLS_PER_RUN:80}
      max-activities-per-run: ${APP_ELEVATION_BACKFILL_MAX_ACTIVITIES_PER_RUN:50}
      sample-distance-meters: ${APP_ELEVATION_BACKFILL_SAMPLE_DISTANCE_METERS:90}
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,https://running-api.pdrgmz.uk,http://running-api.pdrgmz.uk
  openapi:
    server-url: https://running-api.pdrgmz.uk
  auth:
    # Clave de firma JWT (HS256). En producción SIEMPRE sobreescribir vía APP_JWT_SECRET.
    jwt-secret: ${APP_JWT_SECRET:cambia-esta-clave-secreta-de-desarrollo-minimo-32-bytes}
    jwt-expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:1440}
    refresh-expiration-minutes: ${APP_JWT_REFRESH_EXPIRATION_MINUTES:10080}
    # Usuario administrador sembrado al arrancar; recibe las actividades históricas sin dueño.
    admin-email: ${APP_ADMIN_EMAIL:admin@running.local}
    admin-password: ${APP_ADMIN_PASSWORD:Admin1234!}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method


#logging:
 # level.org.hibernate.orm.jdbc.bind: TRACE


logging:
  level:
    com.running.api.service.FileService: DEBUG
    com.running.api.service.BulkUploadStatusTracker: DEBUG
