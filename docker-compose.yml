version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: running-postgres
    restart: always
    environment:
      POSTGRES_DB: running_api
      POSTGRES_USER: runninging
      POSTGRES_PASSWORD: runninging
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U runninging -d running_api" ]
      interval: 5s
      timeout: 5s
      retries: 10

  running-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: running-api
    restart: always
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/running_api
      - SPRING_DATASOURCE_USERNAME=runninging
      - SPRING_DATASOURCE_PASSWORD=runninging
      - APP_CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,https://running-api.pdrgmz.uk,http://running-api.pdrgmz.uk,https://running.pdrgmz.uk}
      - APP_ELEVATION_API_KEY=${APP_ELEVATION_API_KEY:-}
      - APP_ELEVATION_MAX_CALLS_PER_MINUTE=${APP_ELEVATION_MAX_CALLS_PER_MINUTE:-500}
      - APP_ELEVATION_BACKFILL_ENABLED=${APP_ELEVATION_BACKFILL_ENABLED:-true}
      - "APP_ELEVATION_BACKFILL_CRON=${APP_ELEVATION_BACKFILL_CRON:-0 */15 * * * *}"
      - APP_ELEVATION_BACKFILL_MAX_CALLS_PER_RUN=${APP_ELEVATION_BACKFILL_MAX_CALLS_PER_RUN:-80}
      - APP_ELEVATION_BACKFILL_MAX_ACTIVITIES_PER_RUN=${APP_ELEVATION_BACKFILL_MAX_ACTIVITIES_PER_RUN:-50}
      - APP_ELEVATION_BACKFILL_SAMPLE_DISTANCE_METERS=${APP_ELEVATION_BACKFILL_SAMPLE_DISTANCE_METERS:-90}
      - APP_TRAINING_PLAN_ENABLED=${APP_TRAINING_PLAN_ENABLED:-false}
      - "APP_TRAINING_PLAN_CRON=${APP_TRAINING_PLAN_CRON:-0 0 18 * * SUN}"
      - APP_TRAINING_PLAN_N8N_WEBHOOK_URL=${APP_TRAINING_PLAN_N8N_WEBHOOK_URL:-https://n8n.pdrgmz.uk/webhook/training-plan-generate}
      - APP_TRAINING_PLAN_MCP_URL=${APP_TRAINING_PLAN_MCP_URL:-https://running-api.pdrgmz.uk/mcp}  # debe ser resoluble DESDE n8n
      - APP_TRAINING_PLAN_TOKEN_TTL_MINUTES=${APP_TRAINING_PLAN_TOKEN_TTL_MINUTES:-45}
      - APP_TRAINING_PLAN_JOB_TIMEOUT_MINUTES=${APP_TRAINING_PLAN_JOB_TIMEOUT_MINUTES:-60}
      - "APP_TRAINING_PLAN_RECONCILE_CRON=${APP_TRAINING_PLAN_RECONCILE_CRON:-0 */10 * * * *}"
      - APP_TRAINING_PLAN_WEBHOOK_TIMEOUT_SECONDS=${APP_TRAINING_PLAN_WEBHOOK_TIMEOUT_SECONDS:-20}
      - APP_TRAINING_PLAN_MAX_WEEKLY_INCREASE_PERCENT=${APP_TRAINING_PLAN_MAX_WEEKLY_INCREASE_PERCENT:-25}
    volumes:
      - running_api_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: postgres_data
  running_api_storage:
    name: running_api_storage
