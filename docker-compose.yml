version: '3.8'

services:
  # --- Running API ---
  running-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: running-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/running_api
      - SPRING_DATASOURCE_USERNAME=runninging
      - SPRING_DATASOURCE_PASSWORD=runninging
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: running-api-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=running_api
      - POSTGRES_USER=runninging
      - POSTGRES_PASSWORD=runninging
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runninging -d running_api"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Prometheus ---
  prometheus:
    image: prom/prometheus:latest
    container_name: running-api-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    restart: unless-stopped

  # --- Grafana ---
  grafana:
    image: grafana/grafana:latest
    container_name: running-api-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/datasources
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring
    restart: unless-stopped

volumes:
  storage_data:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
