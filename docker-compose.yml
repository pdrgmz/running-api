version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: running-postgres
    restart: always
    environment:
      POSTGRES_DB: running_api
      POSTGRES_USER: runninging
      POSTGRES_PASSWORD: runninging
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runninging -d running_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  running-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: running-api
    restart: always
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/running_api
      - SPRING_DATASOURCE_USERNAME=runninging
      - SPRING_DATASOURCE_PASSWORD=runninging
      - APP_CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,https://running-api.pdrgmz.uk,http://running-api.pdrgmz.uk}
    volumes:
      - running_api_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: postgres_data
  running_api_storage:
    name: running_api_storage
